name: Bug report
description: Report a reproducible problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: result
    attributes:
      label: What happened?
      description: Include the smallest safe reproduction and expected result.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: Commands, logs, or screenshots with secrets removed.
    validations:
      required: true
